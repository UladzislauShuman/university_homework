services:
  spark-master:
    image: apache/spark:3.5.3
    container_name: aobd-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    volumes:
      - ..:/workspace

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: aobd-spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2g spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ..:/workspace

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: aobd-spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2g spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - ..:/workspace
