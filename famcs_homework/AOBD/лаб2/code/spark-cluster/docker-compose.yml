services:
  spark-master:
    image: apache/spark:3.5.3
    container_name: lab2-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    volumes:
      - ..:/workspace

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: lab2-spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2g spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ..:/workspace

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: lab2-spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2g spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ..:/workspace

# сеть, которую создал kafka-cluster - чтобы spark видел брокер по имени kafka
networks:
  default:
    name: lab2-stream
    external: true
