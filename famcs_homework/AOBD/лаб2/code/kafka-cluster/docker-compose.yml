services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: lab2-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181   # порт, по которому брокер ходит в zookeeper
      ZOOKEEPER_TICK_TIME: 2000     # базовый такт zookeeper в мс (на нём считаются таймауты)
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: lab2-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # два входа в брокер: INTERNAL - для контейнеров spark/flink внутри docker-сети,
      # EXTERNAL - для python-скриптов, которые запускаются прямо на компе
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # брокер один, поэтому служебные топики хранятся в одной копии
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

# общая сеть - в неё же потом подключаются spark и flink
networks:
  default:
    name: lab2-stream
