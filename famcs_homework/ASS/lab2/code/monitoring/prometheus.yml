global:
  scrape_interval: 1s       # раз в секунду, чтобы было видно всплеск в момент отказа кэша
  scrape_timeout: 1s

scrape_configs:
  - job_name: app           # spring boot на компе
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: containers
    static_configs:
      - targets: ["cgroup-exporter:9101"]
